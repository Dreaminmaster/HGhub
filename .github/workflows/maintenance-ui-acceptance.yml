name: Maintenance UI acceptance (local fixtures)
on:
  push:
    branches: ["next/maintenance-acceptance-20261125"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: maintenance-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --project tsconfig.tests.json
      - run: pnpm exec playwright-core install --with-deps chromium
      - run: node scripts/test-maintenance.mjs
