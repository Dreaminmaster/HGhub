name: Standalone maintenance lab
on:
  push:
    branches: ["lab/standalone-maintenance-20261126"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: standalone-maintenance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fixtures:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - name: Test inert macOS package replacement and backup recovery
        if: runner.os == 'macOS'
        run: bash tests/macos-package-fixture.sh
      - name: Test standalone local backup utility
        if: runner.os == 'macOS'
        run: python3 -m unittest discover -s tests -p 'test_local_backup.py' -v
      - name: Test generic network diagnostic
        run: python3 -m unittest discover -s tests -p 'test_network_probe.py' -v
