name: Build macOS Release

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

# 连续提交时，只保留最新主分支构建，避免排队旧版本占用运行资源。
concurrency:
  group: hghub-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (${{ matrix.name }})
    # 使用已经实际成功构建 v1.2.4 的 Intel runner 池。
    # Universal 是包含 Apple Silicon arm64 + Intel x64 的通用安装包；
    # 不再把发布依赖于一直在排队中取消的独立 ARM64 runner。
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            name: Intel (x64)
            arch: x64
            runner: macos-15-intel
          - target: universal-apple-darwin
            name: Universal (通用版)
            arch: universal
            runner: macos-15-intel

    steps:
      - uses: actions/checkout@v4

      - name: 对齐版本号
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          node -e "const fs=require('fs');for(const p of ['src-tauri/tauri.conf.json','package.json']){const j=JSON.parse(fs.readFileSync(p));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')}" "$V"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: macos-${{ matrix.target }}

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      # 固定 usque v4.2.1 的上游代码提交，CI 自行编译；安装包运行时不下载可执行文件。
      # 仅 Mac 打包此 MIT 许可组件，iOS/Android/Windows 构建不受影响。
      - name: 安装 Go 用于构建内置 WARP
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false

      - name: 编译固定版本 usque (macOS Universal)
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v4.2.1 \
            https://github.com/Diniboy1123/usque.git "$RUNNER_TEMP/usque"
          test "$(git -C "$RUNNER_TEMP/usque" rev-parse HEAD)" = "6aa03fc97d12848dce34eedbd187fb1077b5d1ea"
          mkdir -p src-tauri/resources
          (
            cd "$RUNNER_TEMP/usque"
            CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w" \
              -o "$GITHUB_WORKSPACE/src-tauri/resources/usque_amd64" .
            CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" \
              -o "$GITHUB_WORKSPACE/src-tauri/resources/usque_arm64" .
          )
          lipo -create -output src-tauri/resources/usque \
            src-tauri/resources/usque_amd64 src-tauri/resources/usque_arm64
          lipo -info src-tauri/resources/usque
          chmod 755 src-tauri/resources/usque
          codesign --force --sign - --timestamp=none src-tauri/resources/usque
          cp "$RUNNER_TEMP/usque/LICENSE.md" src-tauri/resources/LICENSE-usque.txt
          shasum -a 256 src-tauri/resources/usque
          # The final application bundles resources/usque (not the temporary arch files).

      - name: Rust 回归测试（PR）
        if: github.event_name == 'pull_request' && matrix.arch == 'x64'
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib

      - name: 首页故障回归测试（PR）
        if: github.event_name == 'pull_request' && matrix.arch == 'x64'
        run: |
          pnpm exec playwright-core install chromium
          node scripts/test-api-loading.mjs

      - name: 构建 macOS 应用 (DMG + APP)
        run: |
          pnpm tauri build --config src-tauri/tauri.macos.conf.json --target ${{ matrix.target }}

      - name: 验证安装包内置 WARP 二进制
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find src-tauri/target -name 'HGhub.app' -type d | head -n 1)"
          test -n "$APP"
          HELPER="$APP/Contents/Resources/resources/usque"
          test -x "$HELPER"
          test -f "$APP/Contents/Resources/resources/LICENSE-usque.txt"
          lipo -info "$HELPER"
          codesign --verify "$HELPER"
          echo "WARP helper and MIT attribution are packaged correctly."

      - name: 整理构建产物
        shell: bash
        run: |
          V="${{ steps.ver.outputs.version }}"
          mkdir -p artifacts
          
          # 收集 dmg 安装包
          found_dmg=0
          for f in $(find src-tauri/target -name '*.dmg'); do
            echo "发现 DMG: $f"
            cp "$f" "artifacts/HGhub_${V}_${{ matrix.arch }}.dmg"
            found_dmg=1
          done
          
          # 打包 .app 绿色压缩包（便于不需要 DMG 安装的用户直接拖拽）
          for app in $(find src-tauri/target -name 'HGhub.app' -type d); do
            echo "发现 APP: $app"
            tar -czf "artifacts/HGhub_${V}_${{ matrix.arch }}.app.tar.gz" -C "$(dirname "$app")" "HGhub.app"
          done
          
          ls -lh artifacts/
          if [ "$found_dmg" -eq 0 ]; then
            echo "::error::未找到 DMG 构建产物"
            exit 1
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: HGhub-macOS-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error

  publish-release:
    name: 发布 GitHub Release
    if: github.event_name != 'pull_request'
    needs: [macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 下载所有 macOS 产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 查看产物列表
        run: ls -lh artifacts

      - name: 获取版本号
        id: ver
        run: |
          V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}-macos
          name: HGhub v${{ steps.ver.outputs.version }} macOS 专属版
          body: |
            ## HGhub macOS 编译发布版 (v${{ steps.ver.outputs.version }})

            此版本由 [Dreaminmaster/HGhub](https://github.com/Dreaminmaster/HGhub) 独立构建，不是 Minireel 官方发行版；请勿与已重写的上游插件播放器直接同步。
            原项目已在 PR #1 完成 macOS 适配支持，但官方尚未在 Release 页面发布 Mac 版产物。

            ### 免费内置 WARP（macOS）
            - 设置 → 网络 →「一键启用 WARP」，首次需明确接受 Cloudflare 使用条款。
            - 无须单独安装代理或手动填写端口。仅 HGhub 使用 WARP，不接管全系统流量。
            - 内置组件来自 MIT 许可的 usque v4.2.1 固定源码提交，支持手动关闭、启动恢复与出口检测。
            - 若 Cloudflare 服务或所在网络限制连接，则无法保证成功；不能代替来源站点的登录与授权。

            ### 下载说明
            - **Apple Silicon (M1/M2/M3/M4/M5 系列芯片)**: 下载 `HGhub_${{ steps.ver.outputs.version }}_universal.dmg`（包含 arm64）
            - **Intel 芯片**: 推荐下载 `HGhub_${{ steps.ver.outputs.version }}_x64.dmg`
            - **Universal 通用双架构版**: `HGhub_${{ steps.ver.outputs.version }}_universal.dmg` 同时支持 Apple Silicon 和 Intel

            ### macOS 首次打开说明（绕过未签名提示）
            此安装包采用临时签名（ad-hoc），未经过 Apple 公证。如果 macOS 阻止打开，先确认安装包来自本仓库，然后尝试打开一次，再到「系统设置 → 隐私与安全性」选择「仍要打开」（Open Anyway）。
            如果提示文件确实损坏、程序闪退，或程序启动后无法加载内容，不要直接关闭系统安全保护；请先按照仓库 README 的排障步骤检查。
          files: artifacts/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
