name: Build macOS Release

on:
  workflow_dispatch:
  push:
    branches: ["main"]

# 连续提交时，只保留最新主分支构建，避免排队旧版本占用运行资源。
concurrency:
  group: hghub-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (${{ matrix.name }})
    # 使用已经实际成功构建 v1.2.4 的 Intel runner 池。
    # Universal 是包含 Apple Silicon arm64 + Intel x64 的通用安装包；
    # 不再把发布依赖于一直在排队中取消的独立 ARM64 runner。
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            name: Intel (x64)
            arch: x64
            runner: macos-15-intel
          - target: universal-apple-darwin
            name: Universal (通用版)
            arch: universal
            runner: macos-15-intel

    steps:
      - uses: actions/checkout@v4

      - name: 对齐版本号
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          node -e "const fs=require('fs');for(const p of ['src-tauri/tauri.conf.json','package.json']){const j=JSON.parse(fs.readFileSync(p));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')}" "$V"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: macos-${{ matrix.target }}

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 macOS 应用 (DMG + APP)
        run: |
          pnpm tauri build --config src-tauri/tauri.macos.conf.json --target ${{ matrix.target }}

      - name: 整理构建产物
        shell: bash
        run: |
          V="${{ steps.ver.outputs.version }}"
          mkdir -p artifacts
          
          # 收集 dmg 安装包
          found_dmg=0
          for f in $(find src-tauri/target -name '*.dmg'); do
            echo "发现 DMG: $f"
            cp "$f" "artifacts/HGhub_${V}_${{ matrix.arch }}.dmg"
            found_dmg=1
          done
          
          # 打包 .app 绿色压缩包（便于不需要 DMG 安装的用户直接拖拽）
          for app in $(find src-tauri/target -name 'HGhub.app' -type d); do
            echo "发现 APP: $app"
            tar -czf "artifacts/HGhub_${V}_${{ matrix.arch }}.app.tar.gz" -C "$(dirname "$app")" "HGhub.app"
          done
          
          ls -lh artifacts/
          if [ "$found_dmg" -eq 0 ]; then
            echo "::error::未找到 DMG 构建产物"
            exit 1
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: HGhub-macOS-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error

  publish-release:
    name: 发布 GitHub Release
    needs: [macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 下载所有 macOS 产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 查看产物列表
        run: ls -lh artifacts

      - name: 获取版本号
        id: ver
        run: |
          V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}-macos
          name: HGhub v${{ steps.ver.outputs.version }} macOS 专属版
          body: |
            ## HGhub macOS 编译发布版 (v${{ steps.ver.outputs.version }})

            此版本由 [Dreaminmaster/HGhub](https://github.com/Dreaminmaster/HGhub) 独立构建，不是 Minireel 官方发行版；请勿与已重写的上游插件播放器直接同步。
            原项目已在 PR #1 完成 macOS 适配支持，但官方尚未在 Release 页面发布 Mac 版产物。

            ### 下载说明
            - **Apple Silicon (M1/M2/M3/M4/M5 系列芯片)**: 下载 `HGhub_${{ steps.ver.outputs.version }}_universal.dmg`（包含 arm64）
            - **Intel 芯片**: 推荐下载 `HGhub_${{ steps.ver.outputs.version }}_x64.dmg`
            - **Universal 通用双架构版**: `HGhub_${{ steps.ver.outputs.version }}_universal.dmg` 同时支持 Apple Silicon 和 Intel

            ### macOS 首次打开说明（绕过未签名提示）
            此安装包采用临时签名（ad-hoc），未经过 Apple 公证。如果 macOS 阻止打开，先确认安装包来自本仓库，然后尝试打开一次，再到「系统设置 → 隐私与安全性」选择「仍要打开」（Open Anyway）。
            如果提示文件确实损坏、程序闪退，或程序启动后无法加载内容，不要直接关闭系统安全保护；请先按照仓库 README 的排障步骤检查。
          files: artifacts/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
